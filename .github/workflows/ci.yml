name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test --package-path CohereVoiceCore
      - name: Build macOS app
        run: xcodebuild -project CohereVoice.xcodeproj -scheme CohereVoice -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO
      - name: App tests
        run: xcodebuild -project CohereVoice.xcodeproj -scheme CohereVoice -configuration Debug -derivedDataPath build -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - name: Build iOS Simulator app
        run: xcodebuild -project CohereVoice.xcodeproj -scheme CohereVoiceiOS -configuration Debug -derivedDataPath build -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
